<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161314" media="(prefers-color-scheme: dark)">
  <title>설레임 소개팅</title>
  <meta name="description" content="스와이프로 마음에 드는 사람을 찾고, 서로 좋아요하면 바로 대화해보세요.">
  <style>
    :root {
      --bg: #fbf7f5;
      --surface: #ffffff;
      --text: #1f1b1c;
      --muted: #77706f;
      --line: #ece4e1;
      --accent: #ff4f6d;
      --accent-soft: #ffe5ea;
      --accent-text: #ffffff;
      --nope: #6b6b70;
      --bubble-other: #f1ecea;
      --shadow: 0 10px 30px rgba(60, 20, 30, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161314;
        --surface: #221e1f;
        --text: #f4f0f0;
        --muted: #a69e9e;
        --line: #352f30;
        --accent: #ff5f7b;
        --accent-soft: #3d1f26;
        --accent-text: #ffffff;
        --nope: #a0a0a6;
        --bubble-other: #2e2829;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
        "Malgun Gothic", "Noto Sans KR", sans-serif;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }

    /* 화면 전체 높이를 꽉 채우는 세로 레이아웃 */
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding:
        max(12px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        0
        max(16px, env(safe-area-inset-left));
    }
    .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .scroll { overflow-y: auto; padding-bottom: 24px; }

    .top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-bottom: 8px; }
    .top h1 { font-size: 1.25rem; margin: 0; letter-spacing: -0.02em; }
    .top h1 b { color: var(--accent); }
    .pill { font-size: 0.75rem; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: middle; }

    .btn {
      border: 0; border-radius: 14px; padding: 14px 18px; font-weight: 700;
      background: var(--accent); color: var(--accent-text); width: 100%;
    }
    .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .btn:disabled { opacity: 0.5; }
    .icon-btn {
      border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
      padding: 8px 12px; font-size: 0.9rem;
    }
    .error { color: var(--accent); min-height: 1.5em; font-size: 0.9rem; margin: 8px 0; }

    /* ───── 폼 ───── */
    .form label.field { display: block; margin-bottom: 18px; }
    .form .label { display: block; font-weight: 700; font-size: 0.9rem; margin-bottom: 6px; }
    .form .hint { color: var(--muted); font-weight: 400; font-size: 0.8rem; }
    .form input[type=text], .form input[type=email], .form input[type=password],
    .form input[type=number], .form select, .form textarea {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
      background: var(--surface); font-size: 16px;
    }
    .form textarea { resize: vertical; min-height: 90px; }
    .seg { display: flex; gap: 8px; }
    .seg label { flex: 1; }
    .seg input { position: absolute; opacity: 0; pointer-events: none; }
    .seg span {
      display: block; text-align: center; padding: 10px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--surface);
    }
    .seg input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
    .seg input:focus-visible + span { outline: 2px solid var(--accent); }

    .photo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .slot {
      position: relative; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden;
      border: 1px dashed var(--line); background: var(--surface);
      display: grid; place-items: center; color: var(--muted); font-size: 1.6rem; padding: 0;
    }
    .slot.add { border-color: var(--accent); color: var(--accent); }
    .slot img { width: 100%; height: 100%; object-fit: cover; }
    .slot .rm {
      position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%;
      border: 0; background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 0.75rem; display: grid; place-items: center;
    }
    .slot .main-badge {
      position: absolute; left: 4px; bottom: 4px; font-size: 0.65rem; font-weight: 700;
      background: var(--accent); color: var(--accent-text); padding: 1px 6px; border-radius: 999px;
    }
    .spin {
      width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--accent-soft);
      border-top-color: var(--accent); animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
      padding: 6px 12px; font-size: 0.85rem;
    }
    .chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

    .auth-hero { text-align: center; padding: 8vh 0 32px; }
    .auth-hero .logo { font-size: 3rem; }
    .auth-hero h2 { margin: 8px 0 4px; font-size: 1.6rem; letter-spacing: -0.02em; }
    .auth-hero p { margin: 0; color: var(--muted); }
    .row { display: flex; gap: 8px; }

    /* ───── 카드 스와이프 ───── */
    .deck { position: relative; flex: 1; min-height: 0; margin-bottom: 12px; }
    .card {
      position: absolute; inset: 0; border-radius: 24px; overflow: hidden;
      background: var(--surface); box-shadow: var(--shadow);
      display: flex; flex-direction: column;
      touch-action: none; user-select: none; -webkit-user-select: none;
      transition: transform 0.3s ease, opacity 0.3s ease;
      --like: 0; --nope: 0;
    }
    .card.under { transform: scale(0.95) translateY(10px); opacity: 0.85; }
    .card.top { cursor: grab; }
    .card .photo {
      flex: 1; min-height: 120px; display: grid; place-items: center;
      font-size: clamp(4rem, 22vw, 8rem); font-weight: 800; color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }
    .card .photo { position: relative; overflow: hidden; }
    .card .photo.has-img { background: #111; }
    .card .photo img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      display: none; pointer-events: none; -webkit-user-drag: none;
    }
    .card .photo img.active { display: block; }
    .bars { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; gap: 4px; z-index: 1; }
    .bars i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.45); }
    .bars i.on { background: #fff; }
    .stamp { z-index: 2; }
    .card .info { padding: 16px 18px 20px; }
    .card .name { font-size: 1.5rem; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
    .card .name small { font-size: 1.1rem; font-weight: 500; color: var(--muted); margin-left: 6px; }
    .card .meta { color: var(--muted); font-size: 0.9rem; margin: 2px 0 10px; }
    .card .bio {
      margin: 10px 0 0; font-size: 0.95rem; word-break: keep-all;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 0.8rem; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
    .stamp {
      position: absolute; top: 28px; padding: 4px 14px; border: 4px solid; border-radius: 10px;
      font-size: 1.8rem; font-weight: 900; letter-spacing: 0.05em; pointer-events: none;
    }
    .stamp.like { left: 24px; color: #22c55e; transform: rotate(-14deg); opacity: var(--like); }
    .stamp.nope { right: 24px; color: #ef4444; transform: rotate(14deg); opacity: var(--nope); }

    .actions { display: flex; justify-content: center; gap: 28px; padding: 4px 0 12px; }
    .round {
      width: 64px; height: 64px; border-radius: 50%; border: 1px solid var(--line);
      background: var(--surface); box-shadow: var(--shadow); font-size: 1.6rem;
      display: grid; place-items: center;
    }
    .round.pass { color: var(--nope); }
    .round.like { color: var(--accent); }
    .round:active { transform: scale(0.92); }

    .top-actions { display: flex; gap: 8px; align-items: center; }
    .view-toggle { display: flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .view-toggle button { border: 0; background: var(--surface); padding: 8px 12px; font-size: 0.9rem; color: var(--muted); }
    .view-toggle button[aria-pressed=true] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }

    /* ───── 목록 보기 (여러 명) ───── */
    /* 폰은 한 줄에 3명, PC(640px 이상)는 5명. 목록 보기일 때는 화면을 넓게 씀 */
    #main.wide { max-width: 1000px; }
    .grid {
      flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px 8px; align-content: start; padding: 2px 2px 16px;
    }
    .grid .empty { grid-column: 1 / -1; min-height: 60vh; }
    /* 목록 위: 지금 적용된 필터와 맞는 사람 수 */
    .filter-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 12px; margin-bottom: 10px; border-radius: 12px;
      background: var(--accent-soft); font-size: 0.85rem;
    }
    .filter-bar .sum { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .filter-bar b { color: var(--accent); }
    .filter-bar button { flex: none; border: 0; background: none; padding: 4px 0; color: var(--accent); font-weight: 700; font-size: 0.85rem; }
    .tile { position: relative; min-width: 0; transition: transform 0.25s ease, opacity 0.25s ease; }
    .tile.gone { transform: scale(0.85); opacity: 0; }
    .tile-open { display: block; width: 100%; border: 0; padding: 0; background: none; color: var(--text); text-align: left; }
    /* 사진 칸: 3:4 비율 (padding 방식이라 줄 높이가 정확히 잡혀 칸끼리 겹치지 않음) */
    .tile-open .ph {
      position: relative; border-radius: 10px; overflow: hidden; background: var(--line);
      box-shadow: 0 2px 8px rgba(60, 20, 30, 0.12);
    }
    .tile-open .ph::before { content: ""; display: block; padding-top: 133.33%; }
    .tile-open .ph > img, .tile-open .ph > span {
      position: absolute; inset: 0; width: 100%; height: 100%;
    }
    .tile-open .ph > img { object-fit: cover; }
    .tile-open .ph > span {
      display: grid; place-items: center; font-size: clamp(1.6rem, 8vw, 3rem); line-height: 1; font-weight: 800; padding-top: 14%; color: rgba(255, 255, 255, 0.92);
    }
    /* 이름·정보는 사진 아래에 (사진·♥와 겹치지 않게) */
    .tile-open .cap { padding: 4px 2px 0; line-height: 1.3; }
    .tile-open .cap b, .tile-open .cap small {
      display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tile-open .cap b { font-size: 0.9rem; }
    .tile-open .cap small { font-size: 0.75rem; color: var(--muted); }
    .tile-open .cap .ints { display: none; }
    .tile-like {
      position: absolute; right: 5px; top: 5px; width: 30px; height: 30px; border-radius: 50%;
      border: 0; padding: 0; background: var(--surface); color: var(--accent); font-size: 0.9rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25); display: grid; place-items: center;
    }
    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px 12px; }
      .tile-open .ph > span { font-size: clamp(1.6rem, 4.5vw, 3rem); }
      .tile-open .ph { border-radius: 14px; }
      .tile-open .cap { padding: 8px 2px 0; }
      .tile-open .cap b { font-size: 1rem; }
      .tile-open .cap small { font-size: 0.8rem; }
      .tile-open .cap .ints { display: block; }
      .tile-like { width: 36px; height: 36px; right: 8px; top: 8px; font-size: 1.1rem; }
    }
    .tile-like:active { transform: scale(0.9); }

    .profile-dialog { padding: 16px; }
    .detail-card { position: relative; height: min(60vh, 520px); margin-bottom: 8px; }
    .detail-card .card { touch-action: auto; box-shadow: none; border: 1px solid var(--line); }
    .profile-dialog .actions { padding: 8px 0 16px; }

    .empty { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: var(--muted); gap: 12px; padding: 24px; }
    .empty .big { font-size: 3rem; }
    .empty .btn { width: auto; }

    /* ───── 탭바 ───── */
    .tabs {
      display: flex; border-top: 1px solid var(--line); margin: 0 -16px;
      padding-bottom: env(safe-area-inset-bottom); background: var(--bg);
    }
    .tabs button {
      flex: 1; border: 0; background: none; padding: 10px 0 12px; color: var(--muted);
      font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative;
    }
    .tabs button .ic { font-size: 1.3rem; line-height: 1.2; }
    .tabs button[aria-selected=true] { color: var(--accent); font-weight: 700; }
    .dot { position: absolute; top: 8px; left: calc(50% + 10px); width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

    /* ───── 매칭 목록 ───── */
    .section-title { font-size: 0.85rem; color: var(--muted); font-weight: 700; margin: 12px 0 8px; }
    .new-matches { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; }
    .new-matches button { border: 0; background: none; padding: 0; text-align: center; font-size: 0.8rem; flex: none; width: 64px; }
    .avatar {
      width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
      color: #fff; font-weight: 800; font-size: 1.3rem; flex: none; overflow: hidden; background: var(--line);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .new-matches .avatar { width: 60px; height: 60px; margin: 0 auto 4px; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }
    .convo {
      display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 0;
      border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left;
    }
    .convo .txt { flex: 1; min-width: 0; }
    .convo .who { font-weight: 700; }
    .convo .last { color: var(--muted); font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .convo .when { color: var(--muted); font-size: 0.75rem; flex: none; }
    .convo.unread .last { color: var(--text); font-weight: 700; }

    /* ───── 채팅 ───── */
    #chat { position: fixed; inset: 0; background: var(--bg); z-index: 10; }
    #chat .wrap { padding-bottom: 0; }
    .chat-head { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--line); margin: 0 -16px; padding-left: 8px; padding-right: 16px; }
    .chat-head .back { border: 0; background: none; font-size: 1.5rem; padding: 4px 10px; }
    .chat-head .avatar { width: 40px; height: 40px; font-size: 1rem; }
    .chat-head .who { font-weight: 700; }
    .chat-head .sub { font-size: 0.8rem; color: var(--muted); }
    .msgs { flex: 1; overflow-y: auto; padding: 16px 0; display: flex; flex-direction: column; gap: 6px; }
    .msg { max-width: 78%; padding: 8px 12px; border-radius: 18px; word-break: break-word; white-space: pre-wrap; }
    .msg.mine { align-self: flex-end; background: var(--accent); color: var(--accent-text); border-bottom-right-radius: 6px; }
    .msg.other { align-self: flex-start; background: var(--bubble-other); border-bottom-left-radius: 6px; }
    .msg-time { font-size: 0.7rem; color: var(--muted); margin: 0 4px; }
    .msg-time.mine { align-self: flex-end; }
    .msg.typing { display: flex; gap: 4px; padding: 12px 14px; }
    .msg.typing i {
      width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
      animation: blink 1.2s infinite both;
    }
    .msg.typing i:nth-child(2) { animation-delay: 0.2s; }
    .msg.typing i:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
    .chat-hello { text-align: center; color: var(--muted); font-size: 0.9rem; margin: auto 0; }
    .composer {
      display: flex; gap: 8px; padding: 10px 0 max(10px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
    }
    .composer input {
      flex: 1; min-width: 0; padding: 12px 16px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--surface); font-size: 16px;
    }
    .composer button { border: 0; border-radius: 999px; padding: 0 18px; background: var(--accent); color: var(--accent-text); font-weight: 700; }

    /* ───── 내 프로필 ───── */
    .me-card { position: relative; height: 420px; margin-bottom: 16px; }
    .me-card .card { position: absolute; touch-action: auto; }
    .stack { display: flex; flex-direction: column; gap: 10px; }

    /* ───── 다이얼로그 ───── */
    dialog {
      border: 0; border-radius: 24px; padding: 24px; width: min(420px, calc(100vw - 32px));
      background: var(--surface); color: var(--text); box-shadow: var(--shadow);
    }
    dialog::backdrop { background: rgba(20, 10, 14, 0.55); }
    dialog h3 { margin: 0 0 16px; font-size: 1.2rem; }
    .match-dialog { text-align: center; }
    .match-dialog .hearts { font-size: 2.6rem; }
    .match-dialog h3 { font-size: 1.8rem; color: var(--accent); margin: 4px 0; }
    .match-dialog p { color: var(--muted); margin: 0 0 20px; }
    .match-dialog .pair { display: flex; justify-content: center; gap: 0; margin-bottom: 20px; }
    .match-dialog .pair .avatar { width: 84px; height: 84px; font-size: 2rem; box-shadow: 0 0 0 4px var(--surface); }
    .match-dialog .pair .avatar + .avatar { margin-left: -14px; }
  </style>
</head>
<body>
  <!-- ───────── 로그인 ───────── -->
  <div class="wrap" id="auth" hidden>
    <div class="screen scroll">
      <div class="auth-hero">
        <div class="logo">💘</div>
        <h2>설레임</h2>
        <p>넘기다 보면, 마음이 맞는 사람이 있어요</p>
      </div>
      <form class="form" id="auth-form">
        <label class="field"><span class="label">이메일</span>
          <input type="email" name="email" autocomplete="email" required></label>
        <label class="field"><span class="label">비밀번호 <span class="hint">(6자 이상)</span></span>
          <input type="password" name="password" autocomplete="current-password" minlength="6" required></label>
        <p class="error" id="auth-error"></p>
        <div class="stack">
          <button class="btn" type="submit" data-mode="signin">로그인</button>
          <button class="btn ghost" type="submit" data-mode="signup">처음이에요 · 회원가입</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ───────── 프로필 작성/수정 ───────── -->
  <div class="wrap" id="setup" hidden>
    <div class="top"><h1 id="setup-title">프로필 만들기</h1>
      <button class="icon-btn" id="setup-cancel" type="button" hidden>취소</button></div>
    <div class="screen scroll">
      <form class="form" id="profile-form">
        <div class="field"><span class="label">사진 <span class="hint">(최대 4장 · 첫 번째가 대표 사진)</span></span>
          <div class="photo-grid" id="photo-grid"></div>
          <input type="file" id="photo-input" accept="image/*" multiple hidden>
        </div>
        <br>
        <label class="field"><span class="label">이름 (닉네임)</span>
          <input type="text" name="name" maxlength="20" required></label>
        <label class="field"><span class="label">태어난 해 <span class="hint">(19~35세만 가입할 수 있어요)</span></span>
          <input type="number" name="birth_year" inputmode="numeric" required></label>
        <div class="field"><span class="label">성별</span>
          <div class="seg">
            <label><input type="radio" name="gender" value="M" required><span>남성</span></label>
            <label><input type="radio" name="gender" value="F"><span>여성</span></label>
          </div>
        </div>
        <br>
        <div class="field"><span class="label">만나고 싶은 사람</span>
          <div class="seg">
            <label><input type="radio" name="looking_for" value="M" required><span>남성</span></label>

  <script>
    // ─────────────────────────────────────────────────────────────
    // Supabase 설정 (README 참고). 비워두면 "데모 모드"로 내 브라우저 안에서만 동작합니다.
    // ⚠️ anon / publishable 키만 넣으세요. service_role / secret 키는 절대 금지!
    // ─────────────────────────────────────────────────────────────
    window.DATING_CONFIG = {
      SUPABASE_URL: "",
      SUPABASE_KEY: "",
      // 데모 채팅 상대를 내 PC의 로컬 LLM이 대답하게 하기 (llm_server.py 실행 시). 끄려면 ""
      LLM_URL: "http://localhost:7861",

  </script>

  <script>
    (() => {
      const REGIONS = ["서울", "경기", "인천", "부산", "대구", "광주", "대전", "울산", "세종",
        "강원", "충북", "충남", "전북", "전남", "경북", "경남", "제주"];
      const INTERESTS = ["여행", "맛집", "카페", "운동", "등산", "러닝", "영화", "음악", "독서", "게임",
        "요리", "사진", "반려동물", "공연", "드라이브", "패션", "와인", "전시회"];
      const MAX_INTERESTS = 5;
      const MAX_PHOTOS = 4;
      const THIS_YEAR = new Date().getFullYear();
      const MIN_AGE = 19, MAX_AGE = 35; // 가입·검색 가능한 나이
      const DEFAULT_FILTERS = { min_age: MIN_AGE, max_age: MAX_AGE, region: "", interests: [] };

      const { SUPABASE_URL, SUPABASE_KEY, LLM_URL = "" } = window.DATING_CONFIG || {};
      const ONLINE = Boolean(SUPABASE_URL && SUPABASE_KEY);

      // ───── 유틸 ─────
      const $ = (sel, el = document) => el.querySelector(sel);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const age = (p) => THIS_YEAR - p.birth_year;
      const initial = (p) => esc(Array.from(p.name || "?")[0]);
      function gradient(id) {
        let h = 0;
        for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) % 360;
        return `background:linear-gradient(135deg,hsl(${h} 78% 72%),hsl(${(h + 45) % 360} 70% 56%))`;
      }
      function timeLabel(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        const today = new Date().toDateString() === d.toDateString();
        return today
          ? d.toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" })
          : d.toLocaleDateString("ko-KR", { month: "numeric", day: "numeric" });
      }
      const store = {
        get(key, fallback) {
          try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
          catch { return fallback; }
        },
        set(key, value) {
          try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch { return false; }
        },
        del(key) { try { localStorage.removeItem(key); } catch {} },
      };

      // 사진을 긴 변 max px의 JPEG로 줄임 (용량 절약 + 위치정보 등 EXIF 제거)
      async function resizeImage(file, max, quality) {
        const url = URL.createObjectURL(file);
        try {
          const img = new Image();
          img.src = url;
          try { await img.decode(); } catch { throw new Error("이미지 파일을 읽을 수 없어요."); }
          const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.naturalWidth * scale);
          canvas.height = Math.round(img.naturalHeight * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
          if (!blob) throw new Error("이미지를 변환하지 못했어요.");
          return blob;
        } finally {
          URL.revokeObjectURL(url);
        }
      }

      // ───────────────────────────────────────────────
      // 데이터 계층: Supabase(온라인) / 데모(로컬) 가 같은 함수를 제공
      //   profile = { id, name, birth_year, gender, looking_for, region, interests[], bio, photos[] }
      //   photos  = 저장값 배열 (온라인: Storage 경로, 데모: data URL) → 화면에는 api.photoUrl()로 표시
      //   match   = { id, at, other: profile, last: { body, at } | null }
      //   message = { id, matchId, mine, body, at }
      // ───────────────────────────────────────────────
      function createOnlineApi() {
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let uid = null;
        const check = ({ data, error }) => { if (error) throw error; return data; };
        const toMessage = (r) => ({ id: r.id, matchId: r.match_id, mine: r.sender_id === uid, body: r.body, at: r.created_at });
        const PHOTO_BASE = SUPABASE_URL.replace(/\/+$/, "") + "/storage/v1/object/public/photos/";

        return {
          online: true,
          photoUrl: (v) => PHOTO_BASE + v.split("/").map(encodeURIComponent).join("/"),
          async uploadPhoto(file) {
            const blob = await resizeImage(file, 1080, 0.85);
            const path = `${uid}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
            check(await sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000" }));
            return path;
          },
          deletePhotos(paths) {
            if (paths.length) sb.storage.from("photos").remove(paths).catch((err) => console.error(err));
          },
          async session() {
            const { data } = await sb.auth.getSession();
            uid = data.session?.user.id ?? null;
            return Boolean(uid);
          },
          async signIn(email, password) {
            const data = check(await sb.auth.signInWithPassword({ email, password }));
            uid = data.user.id;
          },
          async signUp(email, password) {
            const data = check(await sb.auth.signUp({ email, password }));
            if (!data.session) throw new Error("인증 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요.");
            uid = data.user.id;
          },
          async signOut() { await sb.auth.signOut(); uid = null; },
          async myProfile() {
            return check(await sb.from("profiles").select("*").eq("id", uid).maybeSingle());
          },
          async saveProfile(p) {
            return check(await sb.from("profiles").upsert({ ...p, id: uid }).select().single());
          },
          async candidates(f) {
            return check(await sb.rpc("get_candidates", {
              min_age: f.min_age, max_age: f.max_age,
              f_region: f.region || null, f_interests: f.interests.length ? f.interests : null,
            }));
          },
          async swipe(targetId, like) {
            const matchId = check(await sb.rpc("swipe", { target: targetId, is_like: like }));
            return matchId ?? null;
          },
          async matches() {
            const rows = check(await sb.rpc("my_matches"));
            return rows.map((r) => ({
              id: r.match_id,
              at: r.matched_at,
              other: {
                id: r.other_id, name: r.other_name, birth_year: r.other_birth_year, gender: r.other_gender,
                region: r.other_region, interests: r.other_interests, bio: r.other_bio, photos: r.other_photos,
              },
              last: r.last_body ? { body: r.last_body, at: r.last_at } : null,
            }));
          },
          async messages(matchId) {
            const rows = check(await sb.from("messages").select("*")
              .eq("match_id", matchId).order("id", { ascending: false }).limit(200));
            return rows.reverse().map(toMessage);
          },
          async send(matchId, body) {
            return toMessage(check(await sb.from("messages").insert({ match_id: matchId, body }).select().single()));
          },
          subscribe({ onMessage, onMatch }) {
            const channel = sb.channel("live")
              .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" },
                (payload) => onMessage(toMessage(payload.new)))
              .on("postgres_changes", { event: "INSERT", schema: "public", table: "matches" },
                () => onMatch())
              .subscribe();
            return () => sb.removeChannel(channel);
          },
        };
      }

      // ───────────────────────────────────────────────
      // 데모 상대의 대화: 내 메시지에서 질문/주제를 찾아 상대 프로필(관심사·지역·직업)에 맞게 답함
      // ───────────────────────────────────────────────
      function createDemoChatBot() {
        // 관심사별: [~하고, ~해요] 활동 표현 + 그 주제로 할 말
        const TOPICS = {
          여행: ["여행 다니고", "여행 다녀요", ["최근엔 오사카 다녀왔어요! 다음엔 유럽 가보고 싶어요", "여행 가면 계획파예요, 즉흥파예요?"]],
          맛집: ["맛집 찾아다니고", "맛집 찾아다녀요", ["요즘 꽂힌 건 평양냉면이에요 ㅎㅎ", "최근에 간 맛집 중에 제일 괜찮았던 데 있어요?"]],
          카페: ["카페 가고", "카페 가요", ["성수 쪽 카페 자주 가요. 디저트 맛있는 데 좋아해요", "커피는 아아파예요 따아파예요?"]],

          요리: ["요리하고", "요리해요", ["파스타랑 덮밥 종류 자신 있어요 ㅎㅎ", "제일 좋아하는 음식이 뭐예요?"]],
          사진: ["사진 찍으러 다니고", "사진 찍으러 다녀요", ["필름 카메라로 찍는 거 좋아해요 📷", "사진 찍히는 거 좋아해요, 찍는 거 좋아해요?"]],
          반려동물: ["반려동물이랑 놀고", "반려동물이랑 놀아요", ["집에 귀여운 애가 있어서 집순이/집돌이가 돼요 ㅎㅎ", "강아지파예요 고양이파예요?"]],
          공연: ["공연 보러 가고", "공연 보러 가요", ["뮤지컬이랑 콘서트 자주 가요!", "최근에 본 공연 있어요?"]],
          드라이브: ["드라이브 가고", "드라이브 가요", ["밤에 바다 보러 드라이브 가는 거 좋아해요 🌊", "드라이브할 때 듣는 플레이리스트 있어요?"]],
          패션: ["쇼핑하고", "쇼핑해요", ["옷 구경하는 거 좋아해요. 요즘은 미니멀한 스타일?", "평소 스타일이 어떤 편이에요?"]],
          와인: ["와인 마시고", "와인 마셔요", ["레드보다 화이트 좋아해요 🍷", "술 좋아하세요? 주량이 궁금 ㅎㅎ"]],
          전시회: ["전시 보러 가고", "전시 보러 가요", ["요즘 사진전 많이 보러 다녀요", "최근에 본 전시 중에 기억에 남는 거 있어요?"]],

        const NOW = ["집에서 쉬고 있었어요", "방금 저녁 먹었어요 ㅎㅎ", "씻고 누워있어요", "유튜브 보고 있었어요", "퇴근하고 들어왔어요"];
        const MBTI = ["ENFP", "INFJ", "ISTJ", "ESFJ", "INTP", "ENTJ", "ISFP", "ESTP"];
        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const has = (t, re) => re.test(t);
        // 받침 있으면 a, 없으면 b (예: 등산은 / 카페는)
        const josa = (w, a, b) => { const c = w.charCodeAt(w.length - 1) - 0xac00; return w + (c >= 0 && c % 28 ? a : b); };

        // 상대가 물어볼 질문들 (대화가 이어지도록, 같은 질문은 한 번만)
        function followUps(me) {
          const mine = me.interests || [];
          return [
            ["weekend", `${me.name}님은 주말에 주로 뭐 하세요?`],
            ["hobby", mine[0] && `${mine[0]} 좋아하신다고 봤어요! 어떻게 시작하게 됐어요?`],
            ["place", `${me.region}에 좋아하는 장소 있어요? 추천해 주세요 ㅎㅎ`],
            ["job", "혹시 무슨 일 하세요?"],
            ["movie", "요즘 제일 재밌게 본 거 있어요? 영화든 드라마든!"],
            ["mbti", "MBTI 뭐예요? ㅎㅎ"],
            ["ideal", "이상형이 어떻게 되세요?"],
            ["food", "제일 좋아하는 음식 뭐예요?"],
            ["trip", "요즘 가보고 싶은 여행지 있어요?"],
            ["drink", "술은 좀 하세요? ㅎㅎ"],
          ].filter(([, q]) => q);
        }

        return function reply(other, me, text, memory) {

          ["d40", "성민", 32, "M", "F", "경남", ["사진", "등산", "카페"], "주말엔 카메라 들고 산에 가요. 풍경 사진 좋아해요"],
          ["d41", "은서", 33, "F", "M", "충남", ["요리", "반려동물", "영화"], "강아지랑 산책하고 집밥 해 먹는 소소한 일상 좋아해요"],
          ["d42", "정우", 34, "M", "ALL", "서울", ["와인", "독서", "공연"], "재즈바 좋아해요. 대화 잘 통하는 분 만나고 싶어요"],
          ["d43", "민지", 35, "F", "M", "경기", ["여행", "맛집", "운동"], "요가 5년차예요 🧘 맛있는 거 먹으러 같이 다녀요"],
        ];
        const JOBS = ["UX 디자이너", "백엔드 개발자", "대학원생", "마케터", "요리 강사", "게임 기획자", "공연 기획자", "공무원",
          "대학생", "변호사", "승무원", "패션 MD", "작곡가", "헬스 트레이너", "게스트하우스 사장", "동물병원 직원",
          "대학생", "필라테스 강사", "출판사 편집자", "대학생", "간호사", "대학생", "스타트업 PM", "대학생", "셰프", "리조트 직원",
          "대학교 새내기", "대학생", "대학생", "대학생", "대학생(졸업반)", "신입 회사원", "호텔리어", "소방관", "초등학교 교사",
          "연구원", "브랜드 마케터", "엔지니어", "회계사", "건축가", "약사", "치과의사", "요가 강사"];
        // 데모 프로필은 "나이"로 적어둠 → 해가 바뀌어도 나이가 그대로 (19~35세만 사용)
        const PROFILES = SEED.map(([id, name, ageNow, gender, looking_for, region, interests, bio], i) =>
          ({ id, name, birth_year: THIS_YEAR - ageNow, gender, looking_for, region, interests, bio, job: JOBS[i], likesYou: i % 3 !== 2 }))
          .filter((p) => age(p) >= MIN_AGE && age(p) <= MAX_AGE);
        const reply = createDemoChatBot();
        const pending = {}; // matchId → 답장 타이머 (연달아 보내면 모아서 한 번에 답장)

        let db = store.get(KEY, null) || { me: null, swipes: {}, matches: [], messages: {} };
        const save = () => store.set(KEY, db);
        const byId = (id) => PROFILES.find((p) => p.id === id);
        let listeners = null;

        const toMatch = (m) => {
          const msgs = db.messages[m.id] || [];
          const last = msgs[msgs.length - 1];
          return { id: m.id, at: m.at, other: byId(m.otherId), last: last ? { body: last.body, at: last.at } : null };
        };

        // ───── 로컬 LLM 연결 (llm_server.py) ─────
        const llm = { ok: false, checkedAt: 0 };
        async function checkLlm() {
          if (!LLM_URL) return false;
          llm.checkedAt = Date.now();
          try {
            const res = await fetch(LLM_URL.replace(/\/+$/, "") + "/health", { signal: AbortSignal.timeout(1500) });
            llm.ok = res.ok;
          } catch {
            llm.ok = false;
          }
          return llm.ok;
        }
        const person = (x) => ({ name: x.name, age: age(x), gender: x.gender, region: x.region, interests: x.interests, job: x.job, bio: x.bio });
        const llmBody = (other, history, extra = {}) => JSON.stringify({
          persona: person(other), me: person(db.me), history: history.map((m) => ({ mine: m.mine, body: m.body })), ...extra,
        });
        // 채팅방을 열면 그 사람 프로필·대화를 LLM이 미리 읽어 둠 → 첫 답장도 빠르게
        function llmPrefill(other, history) {
          if (!llm.ok) return;
          fetch(LLM_URL.replace(/\/+$/, "") + "/prefill", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: llmBody(other, history),
          }).catch(() => {});
        }
        // 문장이 완성될 때마다 onText(지금까지의 답장)를 부름. 최종 답장(실패 시 null)을 돌려줌
        async function llmReply(other, history, onText) {
          // 꺼져 있던 서버는 1분마다 다시 확인
          if (!llm.ok && !(LLM_URL && Date.now() - llm.checkedAt > 60000 && await checkLlm())) return null;
          let text = "";
          try {
            const res = await fetch(LLM_URL.replace(/\/+$/, "") + "/reply", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: llmBody(other, history, { stream: true }),
              signal: AbortSignal.timeout(90000),
            });
            if (!res.ok || !res.body) return null;
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buf = "";
            for (;;) {
              const { done, value } = await reader.read();
              if (done) break;
              buf += decoder.decode(value, { stream: true });
              const lines = buf.split("\n");
              buf = lines.pop();
              for (const line of lines) {
                if (!line) continue;
                const data = JSON.parse(line);
                if (data.text) { text = data.text; onText(text); }
              }
            }
            return text || null;
          } catch (err) {
            console.warn("로컬 LLM 응답 실패 → 기본 답장 사용", err);
            llm.ok = false;
            return text || null;
          }
        }

        return {
          online: false,
          async session() { return true; },
          async signOut() { store.del(KEY); db = { me: null, swipes: {}, matches: [], messages: {} }; },
          photoUrl: (v) => v,
          async uploadPhoto(file) {
            const blob = await resizeImage(file, 640, 0.8);
            return new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result);
              reader.onerror = () => reject(new Error("이미지를 읽지 못했어요."));
              reader.readAsDataURL(blob);
            });
          },
          deletePhotos() {},
          async myProfile() { return db.me; },
          async saveProfile(p) {
            const prev = db.me;
            db.me = { ...p, id: "me" };
            if (!save()) {
              db.me = prev;
              throw new Error("브라우저 저장 공간이 부족해요. 사진 수를 줄여주세요.");
            }
            return db.me;
          },
          async candidates(f) {
            const me = db.me;
            return PROFILES.filter((p) =>
              !(p.id in db.swipes)
              && (me.looking_for === "ALL" || p.gender === me.looking_for)
              && (p.looking_for === "ALL" || p.looking_for === me.gender)
              && age(p) >= f.min_age && age(p) <= f.max_age
              && (!f.region || p.region === f.region)
              && (!f.interests.length || p.interests.some((x) => f.interests.includes(x)))
            ).sort(() => Math.random() - 0.5);
          },
          async swipe(targetId, like) {
            db.swipes[targetId] = like;
            let matchId = null;
            if (like && byId(targetId)?.likesYou) {
              matchId = "m-" + targetId;
              if (!db.matches.some((m) => m.id === matchId)) {
                db.matches.push({ id: matchId, otherId: targetId, at: new Date().toISOString() });
              }
            }
            save();
            return matchId;
          },
          async matches() {
            return db.matches.map(toMatch)
              .sort((a, b) => (b.last?.at || b.at).localeCompare(a.last?.at || a.at));
          },
          async messages(matchId) { return db.messages[matchId] || []; },
          async send(matchId, body) {
            const add = (mine, text, id = Date.now() + Math.random(), at = new Date().toISOString()) => {
              const msg = { id, matchId, mine, body: text, at };
              (db.messages[matchId] ||= []).push(msg);
              save();
              return msg;
            };
            const msg = add(true, body);
            // 데모: 상대가 메시지를 읽고(잠깐 뒤) 입력 중… 표시 후 답장
            const match = db.matches.find((m) => m.id === matchId);
            const p = (pending[matchId] ||= { texts: [], timer: null });
            p.texts.push(body);
            clearTimeout(p.timer);
            p.timer = setTimeout(async () => {
              const text = p.texts.join(" ");
              delete pending[matchId];
              const other = byId(match.otherId);
              listeners?.onTyping?.(matchId, true);
              // 로컬 LLM이 켜져 있으면 LLM이 (첫 문장부터 바로 보여주며), 아니면 규칙 기반으로 답장
              const id = Date.now() + Math.random(), at = new Date().toISOString();
              const llmAnswer = await llmReply(other, (db.messages[matchId] || []).slice(-12),
                (partial) => {
                  listeners?.onMessage({ id, matchId, mine: false, body: partial, at });
                  listeners?.onTyping?.(matchId, true); // 다음 문장 쓰는 중
                });
              if (llmAnswer) {
                listeners?.onTyping?.(matchId, false);
                listeners?.onMessage(add(false, llmAnswer, id, at));
                return;
              }
              const memory = ((db.chat ||= {})[matchId] ||= { greeted: false, asked: [] });
              const answer = reply(other, db.me, text, memory);
              save();
              await new Promise((r) => setTimeout(r, Math.min(4000, 700 + answer.length * 45)));
              listeners?.onTyping?.(matchId, false);
              listeners?.onMessage(add(false, answer));
            }, llm.ok ? 400 : 900 + Math.random() * 600); // 연달아 보내는 메시지를 모으는 시간
            return msg;
          },
          subscribe(l) { listeners = l; return () => { listeners = null; }; },
          checkLlm,
          prefill(matchId) {
            const m = db.matches.find((x) => x.id === matchId);
            if (m) llmPrefill(byId(m.otherId), (db.messages[matchId] || []).slice(-12));
          },
        };
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src; s.onload = resolve; s.onerror = () => reject(new Error("스크립트를 불러오지 못했어요: " + src));
          document.head.appendChild(s);

      }

      // ───────────────────────────────────────────────

      let api;

      function loadFilters() {
        const saved = store.get("seollem-filters", {});

        if (saved.interest && !saved.interests) saved.interests = [saved.interest];
        delete saved.interest;
        const f = { ...DEFAULT_FILTERS, ...saved };
        f.interests = (Array.isArray(f.interests) ? f.interests : []).filter((x) => INTERESTS.includes(x));
        f.min_age = Math.min(MAX_AGE, Math.max(MIN_AGE, Number(f.min_age) || MIN_AGE));
        f.max_age = Math.min(MAX_AGE, Math.max(f.min_age, Number(f.max_age) || MAX_AGE));
        return f;
      }
      const saveUnread = () => store.set("seollem-unread", [...state.unread]);

        .map((v) => `<button type="button" class="chip" aria-pressed="false" data-v="${esc(v)}">${esc(v)}</button>`).join("");

      function cardHTML(p, extraClass = "") {
        return `
          <div class="card ${extraClass}" data-id="${esc(p.id)}">

          </div>`;

      function photoHTML(p) {
        const photos = p.photos || [];
        if (photos.length === 0) return `<div class="photo" style="${gradient(p.id)}">${initial(p)}</div>`;
        return `
          <div class="photo has-img">
            ${photos.length > 1 ? `<div class="bars">${photos.map((_, i) => `<i class="${i === 0 ? "on" : ""}"></i>`).join("")}</div>` : ""}
            ${photos.map((v, i) => `<img src="${esc(api.photoUrl(v))}" alt="" draggable="false" class="${i === 0 ? "active" : ""}">`).join("")}
          </div>`;

          : `<div class="avatar"${idAttr} style="${gradient(p.id)}">${initial(p)}</div>`;

      // 카드 사진 넘기기: 왼쪽 절반 탭 = 이전, 오른쪽 절반 = 다음
      function cyclePhoto(card, clientX) {
        const imgs = card.querySelectorAll(".photo img");
        if (imgs.length < 2) return;
        const bars = card.querySelectorAll(".bars i");
        const cur = [...imgs].findIndex((img) => img.classList.contains("active"));
        const rect = card.getBoundingClientRect();
        const next = Math.max(0, Math.min(imgs.length - 1, cur + (clientX - rect.left < rect.width / 2 ? -1 : 1)));
        imgs.forEach((img, i) => img.classList.toggle("active", i === next));
        bars.forEach((bar, i) => bar.classList.toggle("on", i === next));
      }

          else await api.signIn(email, password);

          const msg = String(err.message || err);

          buttons.forEach((b) => (b.disabled = false));

        // 이번에 올렸지만 저장하지 않은 사진은 지움

            return `<button type="button" class="slot add" data-add ${uploading ? "disabled" : ""}
              aria-label="사진 추가">${uploading ? `<span class="spin"></span>` : "+"}</button>`;

      $("#photo-grid").addEventListener("click", (e) => {

      $("#photo-input").addEventListener("change", async (e) => {

        $("#setup-error").textContent = "";

            $("#setup-error").textContent = "사진을 올리지 못했어요: " + (err.message || err);

      $("#profile-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.target;
        const interests = [...$("#interest-chips").querySelectorAll("[aria-pressed=true]")].map((c) => c.dataset.v);
        if (interests.length === 0) { $("#setup-error").textContent = "관심사를 하나 이상 골라주세요."; return; }
        const by = Number(form.elements.birth_year.value);
        if (THIS_YEAR - by < MIN_AGE || THIS_YEAR - by > MAX_AGE) {
          $("#setup-error").textContent = `${MIN_AGE}~${MAX_AGE}세만 가입할 수 있어요. (${THIS_YEAR - MAX_AGE}~${THIS_YEAR - MIN_AGE}년생)`;
          return;
        }
        const profile = {
          name: form.elements.name.value.trim(),
          birth_year: Number(form.elements.birth_year.value),
          gender: form.elements.gender.value,
          looking_for: form.elements.looking_for.value,
          region: form.elements.region.value,
          interests,
          bio: form.elements.bio.value.trim(),
          photos: [...photoEdit.list],
        };
        if (photoEdit.uploading) { $("#setup-error").textContent = "사진을 올리는 중이에요. 잠시만 기다려주세요."; return; }
        const submit = form.querySelector("[type=submit]");
        submit.disabled = true;
        try {
          const first = !state.me;
          const before = [...(state.me?.photos || []), ...photoEdit.uploaded];
          state.me = await api.saveProfile(profile);
          // 빠진 사진은 저장소에서도 삭제
          api.deletePhotos([...new Set(before)].filter((v) => !profile.photos.includes(v)));
          photoEdit.uploaded = [];
          if (first) await startMain();
          else { show("main"); renderMe(); loadDeck(); }
        } catch (err) {
          $("#setup-error").textContent = "저장하지 못했어요: " + (err.message || err);
        } finally {
          submit.disabled = false;
        }
      });

      // ───── 탭 ─────
      function selectTab(name) {
        for (const b of document.querySelectorAll(".tabs button")) {
          b.setAttribute("aria-selected", String(b.dataset.tab === name));
        }
        for (const t of ["discover", "chats", "me"]) $("#tab-" + t).hidden = t !== name;
        $("#main").classList.toggle("wide", name === "discover" && state.view === "grid");
        if (name === "chats") refreshMatches();
        if (name === "me") renderMe();
      }
      document.querySelector(".tabs").addEventListener("click", (e) => {
        const b = e.target.closest("button[data-tab]");
        if (b) selectTab(b.dataset.tab);
      });

      // ───── 탐색 (카드 스와이프) ─────
      async function loadDeck() {
        try {
          state.deck = await api.candidates(state.filters);
        } catch (err) {
          state.deck = [];
          console.error(err);
        }
        renderDiscover();
      }

      const EMPTY_HTML = `
        <div class="empty">
          <div class="big">🌙</div>
          <div>조건에 맞는 사람을 모두 봤어요.<br>필터를 넓히거나 나중에 다시 와주세요.</div>
          <button class="btn" type="button" data-action="filter">필터 바꾸기</button>
        </div>`;

      function renderDiscover() {
        const grid = state.view === "grid";
        for (const b of document.querySelectorAll(".view-toggle button")) {
          b.setAttribute("aria-pressed", String(b.dataset.view === state.view));
        }
        $("#grid").hidden = !grid;
        renderFilterBar();
        $("#main").classList.toggle("wide", grid);
        $("#deck").hidden = grid;
        if (grid) { $("#actions").hidden = true; renderGrid(); }
        else renderDeck();
      }
      document.querySelector(".view-toggle").addEventListener("click", (e) => {
        const b = e.target.closest("[data-view]");
        if (!b || state.busy) return;
        state.view = b.dataset.view;
        store.set("seollem-view", state.view);
        renderDiscover();
      });

      // ───── 목록 보기: 여러 명을 한 화면에 ─────
      function tileHTML(p) {
        const first = (p.photos || [])[0];
        const ph = first
          ? `<div class="ph"><img src="${esc(api.photoUrl(first))}" alt="" loading="lazy"></div>`
          : `<div class="ph" style="${gradient(p.id)}"><span>${initial(p)}</span></div>`;
        return `
          <div class="tile" data-id="${esc(p.id)}">
            <button type="button" class="tile-open" data-open="${esc(p.id)}" aria-label="${esc(p.name)} 프로필 보기">
              ${ph}
              <div class="cap"><b>${esc(p.name)} ${age(p)}</b><small>${esc(p.region)}</small><small class="ints">${esc((p.interests || []).join(" · "))}</small></div>
            </button>
            <button type="button" class="tile-like" data-like="${esc(p.id)}" aria-label="${esc(p.name)}님 좋아요">♥</button>
          </div>`;
      }
      function renderFilterBar() {
        const bar = $("#filter-bar");
        bar.hidden = state.view !== "grid";
        if (bar.hidden) return;
        const f = state.filters;
        const n = state.deck.length;
        const conds = [`${f.min_age}~${f.max_age}세`, f.region || "전국", f.interests.length ? f.interests.join("·") : "관심사 전체"];
        // 온라인은 한 번에 30명까지 불러오므로 30이면 "30명+"
        bar.innerHTML = `<span class="sum">맞는 사람 <b>${n}명${api.online && n >= 30 ? "+" : ""}</b> · ${esc(conds.join(" · "))}</span>
          <button type="button" data-action="filter">필터 바꾸기</button>`;
      }
      $("#filter-bar").addEventListener("click", (e) => {
        if (e.target.closest("[data-action=filter]")) openFilter();
      });

      function renderGrid() {
        renderFilterBar();
        $("#grid").innerHTML = state.deck.length ? state.deck.map(tileHTML).join("") : EMPTY_HTML;
      }
      const findPerson = (id) => state.deck.find((p) => String(p.id) === id);

      $("#grid").addEventListener("click", (e) => {
        if (e.target.closest("[data-action=filter]")) return openFilter();
        const like = e.target.closest("[data-like]");
        if (like) {
          const p = findPerson(like.dataset.like);
          if (p) decideFromGrid(p, true);
          return;
        }
        const open = e.target.closest("[data-open]");
        if (open) {
          const p = findPerson(open.dataset.open);
          if (p) openDetail(p);
        }
      });

      // 목록에서 좋아요/넘기기: 해당 칸만 사라지고 스크롤 위치는 유지
      async function decideFromGrid(person, like) {
        const tile = $(`#grid .tile[data-id="${CSS.escape(String(person.id))}"]`);
        if (!tile || tile.classList.contains("gone")) return;
        tile.classList.add("gone");
        const [result] = await Promise.all([decide(person, like), new Promise((r) => setTimeout(r, 250))]);
        if (!result.ok) { tile.classList.remove("gone"); return; }
        tile.remove();
        renderFilterBar();
        if (state.deck.length === 0) await loadDeck();
        if (result.matchId) showMatch(person, result.matchId);
      }

      // ───── 프로필 자세히 ─────
      let detailPerson = null;
      function openDetail(person) {
        detailPerson = person;
        $("#detail-card").innerHTML = cardHTML(person);
        $("#profile-dialog").showModal();
      }
      $("#detail-card").addEventListener("click", (e) => {
        const card = e.target.closest(".card");
        if (card) cyclePhoto(card, e.clientX);
      });
      $("#detail-close").addEventListener("click", () => $("#profile-dialog").close());
      $("#profile-dialog").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) e.currentTarget.close(); // 바깥 영역 클릭
      });
      for (const [id, like] of [["#detail-like", true], ["#detail-pass", false]]) {
        $(id).addEventListener("click", () => {
          const p = detailPerson;
          $("#profile-dialog").close();
          if (p) decideFromGrid(p, like);
        });
      }

      function renderDeck() {
        const deck = $("#deck");
        const top = state.deck[0];
        $("#actions").hidden = !top;
        if (!top) {
          deck.innerHTML = EMPTY_HTML;
          return;
        }
        deck.innerHTML = (state.deck[1] ? cardHTML(state.deck[1], "under") : "") + cardHTML(top, "top");
        bindDrag(deck.querySelector(".card.top"));
      }
      $("#deck").addEventListener("click", (e) => {
        if (e.target.closest("[data-action=filter]")) openFilter();
      });

      function bindDrag(card) {
        let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false;
        card.addEventListener("pointerdown", (e) => {
          if (state.busy) return;
          dragging = true; dx = 0; dy = 0;
          startX = e.clientX; startY = e.clientY;
          card.setPointerCapture(e.pointerId);
          card.style.transition = "none";
        });
        card.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          dx = e.clientX - startX;
          dy = e.clientY - startY;
          card.style.transform = `translate(${dx}px, ${dy * 0.3}px) rotate(${dx / 18}deg)`;
          card.style.setProperty("--like", Math.max(0, Math.min(1, dx / 100)));
          card.style.setProperty("--nope", Math.max(0, Math.min(1, -dx / 100)));
        });
        const end = (e) => {
          if (!dragging) return;
          dragging = false;
          card.style.transition = "";
          if (Math.abs(dx) > 100) {
            swipe(dx > 0);
          } else {
            if (e.type === "pointerup" && Math.abs(dx) < 6 && Math.abs(dy) < 6) cyclePhoto(card, e.clientX);
            card.style.transform = "";
            card.style.setProperty("--like", 0);
            card.style.setProperty("--nope", 0);
          }
        };
        card.addEventListener("pointerup", end);
        card.addEventListener("pointercancel", end);
      }

      async function swipe(like) {
        const card = $("#deck .card.top");
        const person = state.deck[0];
        if (!card || !person || state.busy) return;
        state.busy = true;

        card.style.setProperty(like ? "--like" : "--nope", 1);
        card.style.transform = `translate(${like ? 140 : -140}vw, 40px) rotate(${like ? 30 : -30}deg)`;
        card.style.opacity = "0";
        const under = $("#deck .card.under");
        if (under) under.classList.remove("under");

        const [result] = await Promise.all([decide(person, like), new Promise((r) => setTimeout(r, 280))]);
        if (state.deck.length === 0) await loadDeck();
        else renderDeck();
        state.busy = false;
        if (result.matchId) showMatch(person, result.matchId);
      }

      // 좋아요/넘기기 저장 + 후보에서 빼기 (카드/목록 공통)
      async function decide(person, like) {
        let matchId = null;
        try {
          matchId = await api.swipe(person.id, like);
        } catch (err) {
          console.error(err);
          alert("저장하지 못했어요. 잠시 후 다시 시도해 주세요.");
          return { ok: false, matchId: null };
        }
        state.deck = state.deck.filter((p) => p.id !== person.id);
        if (matchId) {
          state.unread.add(String(matchId));
          saveUnread();
          updateDot();
        }
        return { ok: true, matchId };
      }
      $("#btn-like").addEventListener("click", () => swipe(true));
      $("#btn-pass").addEventListener("click", () => swipe(false));
      document.addEventListener("keydown", (e) => {
        if ($("#main").hidden || $("#tab-discover").hidden || !$("#chat").hidden || state.view !== "card"
          || document.querySelector("dialog[open]") || e.target.closest("input, textarea, select")) return;
        if (e.key === "ArrowRight") swipe(true);
        if (e.key === "ArrowLeft") swipe(false);
      });

      // ───── 필터 ─────
      function openFilter() {
        const f = $("#filter-form");
        f.elements.min_age.value = state.filters.min_age;
        f.elements.max_age.value = state.filters.max_age;
        f.elements.region.value = state.filters.region;
        for (const chip of $("#filter-chips").children) {
          chip.setAttribute("aria-pressed", String(state.filters.interests.includes(chip.dataset.v)));
        }
        $("#filter-dialog").showModal();
      }
      $("#open-filter").addEventListener("click", openFilter);
      $("#filter-dialog").addEventListener("close", () => {
        const choice = $("#filter-dialog").returnValue;
        if (choice === "reset") {
          state.filters = { ...DEFAULT_FILTERS };
        } else if (choice === "apply") {
          const f = $("#filter-form");
          let min = Math.min(MAX_AGE, Math.max(MIN_AGE, Number(f.elements.min_age.value) || MIN_AGE));
          let max = Math.min(MAX_AGE, Math.max(MIN_AGE, Number(f.elements.max_age.value) || MAX_AGE));
          if (min > max) [min, max] = [max, min];
          const interests = [...$("#filter-chips").querySelectorAll("[aria-pressed=true]")].map((c) => c.dataset.v);
          state.filters = { min_age: min, max_age: max, region: f.elements.region.value, interests };
        } else {
          return;
        }
        $("#filter-dialog").returnValue = "";
        store.set("seollem-filters", state.filters);
        // 필터를 바꾸면 맞는 사람들을 목록으로 한눈에 보여줌
        state.view = "grid";
        store.set("seollem-view", state.view);
        selectTab("discover");
        loadDeck();
      });

      // ───── 매칭 성공 팝업 ─────
      let pendingChat = null;
      function showMatch(person, matchId) {
        pendingChat = matchId;
        $("#match-text").textContent = `${person.name}님도 회원님을 좋아해요!`;
        $("#match-pair").innerHTML = avatarHTML(state.me) + avatarHTML(person);
        $("#match-dialog").showModal();
      }
      $("#match-later").addEventListener("click", () => $("#match-dialog").close());
      $("#match-chat").addEventListener("click", async () => {
        $("#match-dialog").close();
        await refreshMatches();
        const m = state.matches.find((x) => String(x.id) === String(pendingChat));
        if (m) openChat(m);
      });

      // ───── 매칭 · 채팅 목록 ─────
      let refreshing = null;
      function refreshMatches() {
        // 동시에 여러 번 불려도 한 번만 요청
        refreshing ||= api.matches()
          .then((list) => { state.matches = list; renderMatches(); })
          .catch((err) => console.error(err))
          .finally(() => { refreshing = null; });
        return refreshing;
      }

      function renderMatches() {
        const fresh = state.matches.filter((m) => !m.last);
        const talks = state.matches.filter((m) => m.last);
        const el = $("#match-list");
        if (state.matches.length === 0) {
          el.innerHTML = `<div class="empty" style="min-height:60vh"><div class="big">💌</div>
            <div>아직 매칭이 없어요.<br>탐색 탭에서 마음에 드는 사람에게 ♥를 눌러보세요.</div></div>`;
          return;
        }
        el.innerHTML = `
          ${fresh.length ? `<div class="section-title">새로운 매칭 ${fresh.length}</div>
            <div class="new-matches">${fresh.map((m) => `
              <button type="button" data-match="${esc(m.id)}">${avatarHTML(m.other)}${esc(m.other.name)}</button>`).join("")}
            </div>` : ""}
          ${talks.length ? `<div class="section-title">대화</div>
            ${talks.map((m) => `
              <button type="button" class="convo ${state.unread.has(String(m.id)) ? "unread" : ""}" data-match="${esc(m.id)}">
                ${avatarHTML(m.other)}
                <div class="txt"><div class="who">${esc(m.other.name)}</div><div class="last">${esc(m.last.body)}</div></div>
                <div class="when">${timeLabel(m.last.at)}</div>
              </button>`).join("")}` : ""}`;
      }
      $("#match-list").addEventListener("click", (e) => {
        const b = e.target.closest("[data-match]");
        if (!b) return;
        const m = state.matches.find((x) => String(x.id) === b.dataset.match);
        if (m) openChat(m);
      });

      function updateDot() { $("#chat-dot").hidden = state.unread.size === 0; }

      // ───── 채팅방 ─────
      async function openChat(match) {
        state.openMatch = match;
        state.unread.delete(String(match.id));
        saveUnread();
        updateDot();
        const o = match.other;
        $("#chat-avatar").outerHTML = avatarHTML(o, "chat-avatar");
        $("#chat-name").textContent = o.name;
        $("#chat-sub").textContent = `${age(o)}세 · ${o.region} · ${(o.interests || []).join(", ")}`;
        $("#msgs").innerHTML = "";
        $("#chat").hidden = false;
        api.prefill?.(match.id);
        try {
          const list = await api.messages(match.id);
          if (state.openMatch !== match) return;
          $("#msgs").innerHTML = "";
          if (list.length === 0) {
            $("#msgs").innerHTML = `<div class="chat-hello">${esc(o.name)}님과 매칭됐어요 💞<br>먼저 인사를 건네보세요!</div>`;
          }
          list.forEach(appendMessage);
        } catch (err) {
          $("#msgs").innerHTML = `<div class="chat-hello">메시지를 불러오지 못했어요.</div>`;
        }
        $("#composer").elements.body.focus();
      }

      function appendMessage(msg) {
        const box = $("#msgs");
        const existing = box.querySelector(`[data-id="${CSS.escape(String(msg.id))}"]`);
        if (existing) { // 이미 있는 메시지면 (답장이 문장 단위로 이어지는 중) 내용만 갱신
          const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
          existing.textContent = msg.body;
          if (nearBottom) box.scrollTop = box.scrollHeight;
          return;
        }
        box.querySelector(".chat-hello")?.remove();
        $("#typing")?.remove();
        const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
        const side = msg.mine ? "mine" : "other";
        box.insertAdjacentHTML("beforeend",
          `<div class="msg ${side}" data-id="${esc(msg.id)}">${esc(msg.body)}</div>
           <div class="msg-time ${side}">${timeLabel(msg.at)}</div>`);
        if (nearBottom || msg.mine) box.scrollTop = box.scrollHeight;
      }

      $("#chat-back").addEventListener("click", () => {
        state.openMatch = null;
        $("#chat").hidden = true;
        refreshMatches();
      });

      $("#composer").addEventListener("submit", async (e) => {
        e.preventDefault();
        const input = e.target.elements.body;
        const body = input.value.trim();
        const match = state.openMatch;
        if (!body || !match) return;
        input.value = "";
        try {
          const msg = await api.send(match.id, body);
          if (state.openMatch === match) appendMessage(msg);
        } catch (err) {
          input.value = body;
          alert("전송하지 못했어요: " + (err.message || err));
        }
      });

      function onTyping(matchId, on) {
        $("#typing")?.remove();
        if (!on || !state.openMatch || String(state.openMatch.id) !== String(matchId)) return;
        const box = $("#msgs");
        box.insertAdjacentHTML("beforeend", `<div class="msg other typing" id="typing" aria-label="입력 중"><i></i><i></i><i></i></div>`);
        box.scrollTop = box.scrollHeight;
      }

      function onMessage(msg) {
        if (state.openMatch && String(state.openMatch.id) === String(msg.matchId)) {
          appendMessage(msg);
        } else if (!msg.mine) {
          state.unread.add(String(msg.matchId));
          saveUnread();
          updateDot();
        }
        refreshMatches();
      }
      function onMatch() {
        // 상대가 나중에 좋아요를 눌러 매칭된 경우 (실시간 알림)
        const before = new Set(state.matches.map((m) => String(m.id)));
        refreshMatches().then(() => {
          for (const m of state.matches) {
            if (!before.has(String(m.id))) state.unread.add(String(m.id));
          }
          saveUnread();
          updateDot();
        });
      }

      // ───── 내 프로필 ─────
      function renderMe() {
        if (!state.me) return;
        $("#me-card").innerHTML = cardHTML(state.me);
        $("#sign-out").textContent = api.online ? "로그아웃" : "데모 초기화";
      }
      $("#edit-profile").addEventListener("click", () => openSetup(true));
      $("#me-card").addEventListener("click", (e) => {
        const card = e.target.closest(".card");
        if (card) cyclePhoto(card, e.clientX);
      });
      $("#sign-out").addEventListener("click", async () => {
        if (!api.online && !confirm("데모 데이터(프로필, 매칭, 채팅)를 모두 지울까요?")) return;
        state.unsubscribe?.();
        await api.signOut();
        store.del("seollem-unread");
        location.reload();
      });

      // ───── 시작 ─────
      async function startMain() {
        show("main");
        $("#demo-pill").hidden = api.online;
        if (!api.online) {
          api.checkLlm().then((ok) => {
            $("#demo-pill").textContent = ok ? "데모 · AI 대화" : "데모";
            $("#demo-pill").title = ok ? "채팅 상대가 내 PC의 로컬 LLM으로 대답해요" : "";
          });
        }
        selectTab("discover");
        updateDot();
        state.unsubscribe?.();
        state.unsubscribe = api.subscribe({ onMessage, onMatch, onTyping });
        await Promise.all([loadDeck(), refreshMatches()]);
      }

      async function enter() {
        state.me = await api.myProfile();
        if (state.me) await startMain();
        else openSetup(false);
      }

      async function boot() {
        if (ONLINE) {
          try {
            await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2");
            api = createOnlineApi();
          } catch (err) {
            alert("서버에 연결하지 못해 데모 모드로 실행합니다.");
            api = createDemoApi();
          }
        } else {
          api = createDemoApi();
        }
        if (await api.session()) await enter();
        else show("auth");
      }
      boot().catch((err) => {
        console.error(err);
        document.body.innerHTML = `<p style="padding:24px">앱을 시작하지 못했어요: ${esc(err.message || err)}</p>`;
      });
    })();
  </script>
</body>
</html>
